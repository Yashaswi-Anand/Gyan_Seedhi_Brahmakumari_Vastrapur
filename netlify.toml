# Netlify build settings (picked up automatically when the GitHub repo is linked)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless functions (POST /api/translate). Needs ANTHROPIC_API_KEY set in
# Site configuration → Environment variables.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Hashed asset files never change, so let browsers cache them for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
