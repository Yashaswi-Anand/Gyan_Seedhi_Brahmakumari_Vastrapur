# Netlify build settings (picked up automatically when the GitHub repo is linked)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless functions (/api/qa-chat, /api/translate, /api/settings, /api/murli).
# Needs GEMINI_API_KEY set in Site configuration → Environment variables
# (optional GEMINI_MODEL to use another Gemini model).
# AI chat with Claude on the VPS instead: AI_PROVIDER=claude-vps + FIREBASE_SERVICE_ACCOUNT
# (optional AI_DAILY_TURNS, default 400). See poller/README.md.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # loaded only when AI_PROVIDER=claude-vps (the AI chat answered by Claude on the VPS, see poller/README.md)
  external_node_modules = ["firebase-admin"]

# Hashed asset files never change, so let browsers cache them for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must always be re-checked so app updates reach installed phones
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
